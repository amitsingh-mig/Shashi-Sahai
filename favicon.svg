<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0d0d0d"/>
  <!-- Aperture blades -->
  <g fill="none" stroke="#c01412" stroke-width="2" stroke-linecap="round">
    <!-- Outer ring -->
    <circle cx="32" cy="32" r="26" stroke="#c01412" stroke-width="1.5" opacity="0.7"/>
    <!-- Inner ring -->
    <circle cx="32" cy="32" r="17" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <!-- Center dot -->
    <circle cx="32" cy="32" r="6" fill="#c01412" stroke="none"/>
    <!-- Aperture blades (6 blades) -->
    <line x1="32" y1="6" x2="32" y2="18" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="32" y1="46" x2="32" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="6" y1="32" x2="18" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="46" y1="32" x2="58" y2="32" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="14.4" y1="14.4" x2="22.7" y2="22.7" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="41.3" y1="41.3" x2="49.6" y2="49.6" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="49.6" y1="14.4" x2="41.3" y2="22.7" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="22.7" y1="41.3" x2="14.4" y2="49.6" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  </g>
  <!-- Center highlight -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
